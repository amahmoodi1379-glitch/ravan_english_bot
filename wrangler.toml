name = "ravan-english-bot"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Run the Worker close to the D1 primary instead of at the edge nearest the user.
# Each button press makes several sequential D1 queries; placing the Worker near
# the database shortens every one of those round-trips (the Telegram round-trips
# happen from Cloudflare's backbone either way).
[placement]
mode = "smart"

[vars]
TELEGRAM_WEBHOOK_SECRET = "ravan_english"

[[d1_databases]]
binding = "DB"
database_name = "ravan_english_local"
database_id = "aeead8fa-8703-415d-b387-0e9d69e92a83"

[triggers]
# Iran is UTC+3:30. Firing at UTC minute :30 lands on Iran wall-clock HH:00, so
# every `iranHour === X` block in scheduled() runs at exactly Iran X:00 (the 21:00
# tournament open, 22:00 close, Sat 00:00 league settle, 10:00 reminders, ...).
# A "0 * * * *" schedule fires at Iran HH:30 — half an hour into each window —
# which delayed the nightly tournament's creation to 21:30, eating the first third
# of its advertised 21:00–21:45 join window. Keep this at :30 unless Iran's offset
# changes.
crons = ["30 * * * *"]


